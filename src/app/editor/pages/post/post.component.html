<div class="flex min-h-dvh flex-col bg-backone">
  <div class="shrink-0">
    <app-header-component [showCategoryNavBar]="false"></app-header-component>
  </div>

  <main class="flex min-h-0 flex-1 flex-col px-4 py-6 md:px-6 md:py-8">
    <div class="mx-auto flex w-full max-w-full flex-col gap-6 md:max-w-7xl md:gap-8 xl:max-w-[90rem] 2xl:max-w-[96rem]">
      <!-- Header / CTA -->
      <section class="flex w-full flex-col items-center justify-center gap-3 rounded border border-primary/35 bg-primary/[0.08] px-6 py-8 text-center text-secondary shadow-sm md:gap-4 md:px-10 md:py-10">
        <h1 class="text-base font-bold tracking-wide md:text-xl lg:text-2xl">All posts</h1>
        <p class="max-w-xl text-xs font-medium leading-relaxed text-secondary/85 md:text-sm lg:text-base">
          Manage all the Posts from here
        </p>
        <div class="mt-1 flex flex-row flex-wrap items-center justify-center gap-3 md:gap-4">
          <a *ngIf="showNewPostButton" [routerLink]="['/editor/posts/new']" class="button inline-flex items-center justify-center rounded border border-primary/35 bg-primary px-5 py-2.5 text-center text-xs font-semibold text-backone hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/25 md:px-6 md:py-3 md:text-sm">
            New Post
          </a>
          <a [routerLink]="['/editor/dashboard']" class="button inline-flex items-center justify-center rounded border border-primary/35 bg-primary px-5 py-2.5 text-center text-xs font-semibold text-backone hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/25 md:px-6 md:py-3 md:text-sm">Back to Dashboard</a>
        </div>
      </section>

      <!-- Table -->
      <section class="grid w-full max-w-full grid-cols-1 place-items-stretch  rounded border border-primary bg-backone p-6 text-secondary shadow-sm  md:p-8 ">
        <router-outlet ></router-outlet>
      </section>
    </div>
  </main>

  <div class="shrink-0">
    <app-footer-component></app-footer-component>
  </div>
</div>
