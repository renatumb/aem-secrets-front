<div class="flex min-h-dvh flex-col bg-backone">
  <div class="shrink-0">
    <app-header-component [showCategoryNavBar]="false"></app-header-component>
  </div>

  <main class="flex min-h-0 flex-1 flex-col px-4 py-6 md:px-6 md:py-8">
    <div class="container mx-auto flex w-full max-w-5xl flex-col gap-6 md:gap-8">
      <!-- Header / CTA -->
      <section class="flex flex-col items-center justify-center gap-3 rounded border border-primary/35 bg-primary/[0.08] px-6 py-8 text-center text-secondary shadow-sm md:gap-4 md:px-10 md:py-10">
        <h1 class="text-base font-bold tracking-wide md:text-xl lg:text-2xl">All Subscribers</h1>
        <p class="max-w-xl text-xs font-medium leading-relaxed text-secondary/85 md:text-sm lg:text-base">
          From here you can manage your subscribers.
        </p>
        <a [routerLink]="['/editor/dashboard']" class="button mt-1 inline-flex items-center justify-center rounded border border-primary/35 bg-primary px-5 py-2.5 text-center text-xs font-semibold text-backone  hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/25 md:px-6 md:py-3 md:text-sm">
          Back to Dashboard
        </a>
      </section>

      <!-- Table -->
      <section class="container mx-auto place-items-stretch border border-primary grid w-full max-w-5xl grid-cols-1 gap-5 rounded bg-backone p-10 text-secondary shadow-sm md:gap-12">
        <h2 class="sr-only">Subscribers list</h2>
        <div class="w-full overflow-x-auto rounded border border-secondary/15 bg-secondary/5">
          <table class="w-full min-w-[28rem] border-collapse text-left text-xs text-secondary md:text-sm">
            <thead>
            <tr class="border-b-2 border-secondary bg-secondary/10">
              <th class="px-4 py-3 font-bold md:px-5 md:py-3.5">No</th>
              <th class="px-4 py-3 font-bold md:px-5 md:py-3.5">Name</th>
              <th class="px-4 py-3 font-bold md:px-5 md:py-3.5">Email</th>
              <th class="px-4 py-3 text-center align-middle font-bold md:px-5 md:py-3.5">Status</th>
              <th class="px-4 py-3 text-center align-middle font-bold md:px-5 md:py-3.5">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let row of subscribers" class="border-b border-secondary/15 last:border-b-0 odd:bg-backone/60 even:bg-secondary/[0.04]">
              <td class="px-4 py-3 font-medium md:px-5 md:py-3.5">{{ row.no }}</td>
              <td class="px-4 py-3 font-medium md:px-5 md:py-3.5">{{ row.name }}</td>
              <td class="px-4 py-3 font-medium md:px-5 md:py-3.5">{{ row.email }}</td>
              <td class="px-4 py-3 text-center align-middle md:px-5 md:py-3.5">
                <span class="inline-block h-3 w-3 rounded-full align-middle md:h-3.5 md:w-3.5" [class.bg-emerald-500]="row.enabled" [class.bg-red-500]="!row.enabled" [attr.aria-label]="row.enabled ? 'Enabled' : 'Disabled'" role="img"></span>
              </td>
              <td class="px-4 py-3 text-center align-middle md:px-5 md:py-3.5">
                <div class="flex flex-wrap items-center justify-center gap-2">
                  <button type="button" role="switch" [attr.aria-checked]="row.enabled" [attr.aria-label]="(row.enabled ? 'Disable' : 'Enable') + ' subscriber ' + row.name" (click)="toggleEnabled(row)" class="relative inline-flex h-7 w-12 shrink-0 items-center rounded-full border  focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40" [ngClass]="    row.enabled      ? 'border-emerald-600/50 bg-emerald-600/35'      : 'border-secondary/30 bg-secondary/20'  ">
                    <span class="pointer-events-none absolute top-1/2 h-5 w-5 -translate-y-1/2 rounded-full bg-backone shadow transition-all duration-200 ease-out" [ngClass]="row.enabled ? 'left-[calc(100%-1.375rem)]' : 'left-0.5'"></span>
                  </button>
                  <button type="button" (click)="deleteSubscriber(row)" class="border border-secondary/35 bg-secondary/15 px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wide text-secondary  hover:bg-secondary/25 focus:outline-none focus:ring-2 focus:ring-secondary/20  md:text-xs">
                    Delete
                  </button>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div class="shrink-0">
    <app-footer-component></app-footer-component>
  </div>
</div>
