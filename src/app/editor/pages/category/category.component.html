<app-header-component [showCategoryNavBar]="false"></app-header-component>
<main class="bg-backone">
  <section class="container mx-auto place-items-stretch border border-primary grid w-full max-w-5xl grid-cols-1 gap-5 rounded bg-backone p-10 text-secondary shadow-sm md:gap-12">
    <!-- Create category -->
    <div class="w-full space-y-4 md:space-y-5">
      <h2 class="text-center text-sm font-bold uppercase tracking-wide md:text-base lg:text-lg">Create category</h2>
      <div class="flex w-full flex-col gap-3 sm:flex-row sm:items-stretch sm:justify-center sm:gap-4">
        <input type="text" name="newCategory" [(ngModel)]="newCategoryName" (keydown.enter)="$event.preventDefault(); saveCategory()" placeholder="Type a category" class="min-h-[2.75rem] w-full flex-1 rounded border border-secondary/25 bg-secondary/10 px-3 py-2.5 text-xs font-medium text-secondary placeholder:text-secondary/45 focus:border-primary/40 focus:outline-none focus:ring-2 focus:ring-primary/15 sm:min-w-0 md:px-4 md:py-3 md:text-sm"/>
        <button type="button" (click)="saveCategory()" class=" shrink-0 rounded border border-primary/30 bg-primary px-5 py-2.5 text-center text-xs font-semibold text-backone  hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/25 sm:w-auto md:px-6 md:py-3 md:text-sm">Save</button>
      </div>
    </div>

    <!-- Category list -->
    <div class="w-full space-y-4 md:space-y-5">
      <h2 class="sr-only">Category list</h2>
      <div class="w-full overflow-x-auto rounded border border-secondary/15 bg-secondary/5">
        <table class="w-full min-w-[20rem] border-collapse text-left text-xs md:text-sm">
          <thead>
          <tr class="border-b-2 border-secondary bg-secondary/10">
            <th class="px-3 py-3 font-bold uppercase tracking-wide md:px-4 md:py-3.5">ID</th>
            <th class="px-3 py-3 text-center font-bold uppercase tracking-wide md:px-4 md:py-3.5">Category</th>
            <th class="px-3 py-3 text-right font-bold uppercase tracking-wide md:px-4 md:py-3.5">Action</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let row of categories" class="border-b border-secondary/15 last:border-b-0 odd:bg-backone/60 even:bg-secondary/[0.04]">
            <td class="px-3 py-3 font-medium md:px-4 md:py-3.5">ID {{ row.id }}</td>
            <td class="px-3 py-3 text-center font-medium md:px-4 md:py-3.5">{{ row.description }}</td>
            <td class="px-3 py-3 text-right md:px-4 md:py-3.5">
              <div class="inline-flex flex-wrap items-center justify-end gap-2">
                <button type="button" (click)="editCategory(row)" class="border border-primary/40 bg-primary/15 px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wide text-primary  hover:bg-primary/25 focus:outline-none focus:ring-2 focus:ring-primary/20  md:text-xs">Edit</button>
                <button type="button" (click)="deleteCategory(row.id)" class="border border-secondary/35 bg-secondary/15 px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wide text-secondary  hover:bg-secondary/25 focus:outline-none focus:ring-2 focus:ring-secondary/20  md:text-xs">Delete</button>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>
<app-footer-component></app-footer-component>
