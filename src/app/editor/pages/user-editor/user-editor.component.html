<div class="flex min-h-dvh flex-col bg-backone">
  <div class="shrink-0">
    <app-header-component [showCategoryNavBar]="false"></app-header-component>
  </div>

  <main class="flex min-h-0 flex-1 flex-col px-4 py-6 md:px-6 md:py-8">
    <div class="container mx-auto flex w-full max-w-3xl flex-col gap-6 md:gap-8">
      <section class="flex flex-col items-center justify-center gap-3 rounded border border-primary/35 bg-primary/[0.08] px-6 py-8 text-center text-secondary shadow-sm md:gap-4 md:px-10 md:py-10">
        <h1 class="text-base font-bold tracking-wide md:text-xl lg:text-2xl">Edit User</h1>
        <p class="max-w-xl text-xs font-medium leading-relaxed text-secondary/85 md:text-sm lg:text-base">
          Update profile details, access level, and lock status.
        </p>
        <button type="button" (click)="onCancel()"
          class="button mt-1 inline-flex items-center justify-center rounded border border-primary/35 bg-primary px-5 py-2.5 text-center text-xs font-semibold text-backone hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/25 md:px-6 md:py-3 md:text-sm">
          Back to Users
        </button>
      </section>

      <section class="rounded border border-primary bg-backone p-6 text-secondary shadow-sm md:p-8">
        <p *ngIf="loading" class="mb-4 text-center text-xs font-medium text-secondary/70 md:text-sm">Loading user…</p>
        <p *ngIf="loadError" class="mb-4 text-center text-xs font-medium text-red-600 md:text-sm" role="alert">{{ loadError }}</p>
        <p *ngIf="saveSuccess" class="mb-4 text-center text-xs font-medium text-emerald-700 md:text-sm" role="status">{{ saveSuccess }}</p>
        <p *ngIf="saveError" class="mb-4 text-center text-xs font-medium text-red-600 md:text-sm" role="alert">{{ saveError }}</p>

        <form *ngIf="editingUser && !loading" class="flex flex-col gap-5 md:gap-6" (ngSubmit)="onSave()">
          <!-- Read-only identity -->
          <div class="grid grid-cols-1 gap-4 md:grid-cols-2 md:gap-5">
            <div class="space-y-1.5">
              <label for="user-id" class="block text-xs font-medium text-secondary/70 md:text-sm">Id</label>
              <input id="user-id" type="text" [value]="formUserId" readonly tabindex="-1" aria-readonly="true" class="w-full cursor-default rounded-md border border-secondary/20 bg-secondary/10 px-3 py-2.5 text-sm text-secondary/80 md:text-base"/>
            </div>
            <div class="space-y-1.5">
              <label for="user-name" class="block text-xs font-medium text-secondary/70 md:text-sm">Name</label>
              <input id="user-name" type="text" [value]="formName"  tabindex="-1"  class="w-full cursor-default rounded-md border border-secondary/20 bg-backone px-3 py-2.5 text-sm text-secondary/80 md:text-base"/>
            </div>
            <div class="space-y-1.5">
              <label for="user-email" class="block text-xs font-medium text-secondary/70 md:text-sm">Email</label>
              <input id="user-email" type="email" [value]="formEmail" readonly tabindex="-1" aria-readonly="true" class="w-full cursor-default rounded-md border border-secondary/20 bg-secondary/10 px-3 py-2.5 text-sm text-secondary/80 md:text-base"/>
            </div>
            <div class="space-y-1.5">
              <label for="user-password" class="block text-xs font-medium text-secondary/70 md:text-sm">Password</label>
              <input id="user-password" type="password" [value]="passwordMask"  tabindex="-1" aria-disabled="true" autocomplete="off" class="w-full cursor-default rounded-md border border-secondary/20 bg-backone px-3 py-2.5 text-sm text-secondary/80 md:text-base"/>
            </div>
          </div>

          <!-- Editable fields -->
          <div class="space-y-1.5">
            <label for="user-about" class="block text-xs font-medium text-secondary/70 md:text-sm">About</label>
            <textarea id="user-about" name="about" [(ngModel)]="formAbout" rows="4" [disabled]="controlsDisabled" class="min-h-[6rem] w-full resize-y rounded-md border border-secondary/25 bg-backone px-3 py-2.5 text-sm leading-relaxed text-secondary placeholder:text-secondary/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 disabled:opacity-60 md:text-base"></textarea>
          </div>

          <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
            <!--            -->
            <div class="space-y-2">
              <span class="block text-xs font-medium text-secondary/70 md:text-sm">Profile photo</span>
              <div class="h-28 w-28 overflow-hidden rounded-full border border-secondary/20 bg-secondary/5">
                <img [src]="formPhotoPreview || placeholderPhoto" alt="Profile photo preview" (error)="onPhotoError($event)" class="h-full w-full object-cover"/>
              </div>
              <div class="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center sm:gap-x-3 sm:gap-y-1">
                <label class="inline-flex cursor-pointer items-center justify-center rounded-md border border-primary/40 bg-primary px-3 py-2 text-center text-xs font-semibold text-backone transition-colors hover:bg-primary/90 focus-within:outline-none focus-within:ring-2 focus-within:ring-primary/30 md:text-sm" [class.pointer-events-none]="controlsDisabled" [class.opacity-60]="controlsDisabled">
                  <span>Choose File</span>
                  <input type="file" accept="image/*" class="sr-only" (change)="onPhotoFileChange($event)" [disabled]="controlsDisabled"/>
                </label>
                <span class="text-xs text-secondary/70">{{ selectedPhotoLabel }}</span>
              </div>
            </div>
            <!--            -->
            <div class="flex flex-col gap-5">
              <div class="space-y-1.5">
                <label for="user-access-level" class="block text-xs font-medium text-secondary/70 md:text-sm">Access level</label>
                <select id="user-access-level" name="accessLevel" [(ngModel)]="formAccessLevel" required [disabled]="controlsDisabled" class="w-full rounded-md border border-secondary/25 bg-backone px-3 py-2.5 text-sm text-secondary focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 disabled:opacity-60 md:text-base">
                  <option [ngValue]="null" disabled>Select access level</option>
                  <option *ngFor="let level of accessLevelOptions" [ngValue]="level">{{ level }}</option>
                </select>
              </div>

              <div class="space-y-2">
                <span class="block text-xs font-medium text-secondary/70 md:text-sm">Status</span>
                <div class="flex items-center gap-3">
                  <button type="button" role="switch" [attr.aria-checked]="formAccountLocked" [attr.aria-label]="(formAccountLocked ? 'Unlock' : 'Lock') + ' account'" (click)="toggleAccountLocked()" [disabled]="controlsDisabled" [ngClass]="formAccountLocked ? 'border-red-600/50 bg-red-600/35' : 'border-emerald-600/50 bg-emerald-600/35'" class="relative inline-flex h-7 w-12 shrink-0 items-center rounded-full border focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 disabled:opacity-60">
                    <span class="pointer-events-none absolute top-1/2 h-5 w-5 -translate-y-1/2 rounded-full bg-backone shadow transition-all duration-200 ease-out" [ngClass]="formAccountLocked ? 'left-[calc(100%-1.375rem)]' : 'left-0.5'"></span>
                  </button>
                  <span class="text-xs font-medium text-secondary/80 md:text-sm">
                    {{ formAccountLocked ? 'Locked' : 'Unlocked' }}
                  </span>
                </div>
              </div>
            </div>
          </div>

          <div class="flex flex-col items-center gap-3 pt-2 sm:flex-row sm:justify-center">
            <button type="submit" [disabled]="controlsDisabled" class="button inline-flex items-center justify-center rounded border border-primary/35 bg-primary px-5 py-2.5 text-center text-xs font-semibold uppercase tracking-wide text-backone hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/25 disabled:opacity-60 md:px-6 md:py-3 md:text-sm">{{ saving ? 'Saving…' : 'Save' }}
            </button>
            <button type="button" (click)="onCancel()" [disabled]="saving" class="button inline-flex items-center justify-center rounded border border-secondary/35 bg-secondary/15 px-5 py-2.5 text-center text-xs font-semibold text-secondary hover:bg-secondary/25 focus:outline-none focus:ring-2 focus:ring-secondary/20 disabled:opacity-60 md:px-6 md:py-3 md:text-sm">Cancel
            </button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <div class="shrink-0">
    <app-footer-component></app-footer-component>
  </div>
</div>
