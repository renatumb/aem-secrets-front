<div class="relative flex flex-col gap-6 md:gap-8">
  <p *ngIf="postLoading" class="text-center text-xs font-medium text-secondary/70 md:text-sm">Loading post…</p>
  <p *ngIf="postLoadError" class="text-center text-xs font-medium text-red-600 md:text-sm" role="alert">{{ postLoadError }}</p>
<!--  -->
  <div class="flex justify-end">
    <a [routerLink]="['/editor/posts']" class="button inline-flex items-center justify-center rounded border border-secondary/35 bg-secondary/15 px-4 py-2 text-xs font-semibold text-secondary hover:bg-secondary/25 focus:outline-none focus:ring-2 focus:ring-secondary/20 md:px-5 md:py-2.5 md:text-sm">
      Cancel
    </a>
  </div>

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-3 lg:gap-8">
    <!-- Main column: title, permalink, excerpt -->
    <section class="space-y-4 rounded-md border border-secondary/15 bg-white p-6 text-secondary shadow-sm lg:col-span-2 lg:space-y-5">
      <div class="space-y-1.5">
        <label for="post-title" class="block text-xs font-medium text-secondary/70 md:text-sm">Title</label>
        <input id="post-title" type="text" name="postTitle" [ngModel]="formPostTitle" (ngModelChange)="onTitleChange($event)" placeholder="Post Title" class="w-full rounded-md border border-secondary/25 bg-backone px-3 py-2.5 text-sm text-secondary placeholder:text-secondary/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 md:text-base"/>
      </div>

      <div class="space-y-1.5">
        <label for="post-permalink" class="block text-xs font-medium text-secondary/70 md:text-sm">Permalink</label>
        <input id="post-permalink" type="text" [value]="formPermalinkSlug" readonly tabindex="-1" aria-readonly="true" class="w-full cursor-default rounded-md border border-secondary/20 bg-secondary/10 px-3 py-2.5 text-sm text-secondary/80 md:text-base"
        />
      </div>

      <div class="space-y-1.5">
        <label for="post-excerpt" class="block text-xs font-medium text-secondary/70 md:text-sm">Excerpt</label>
        <textarea id="post-excerpt" name="excerpt" [(ngModel)]="formExcerpt" rows="5" class="min-h-[8rem] w-full resize-y rounded-md border border-secondary/25 bg-backone px-3 py-2.5 text-sm leading-relaxed text-secondary placeholder:text-secondary/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 md:text-base"></textarea>
      </div>
<!---->
      <div class="space-y-1.5">
        <label for="post-tags" class="block text-xs font-medium text-secondary/70 md:text-sm">Tags</label>
        <input id="post-tags" type="text" name="tags" [(ngModel)]="formTagsText" placeholder="e.g. angular, web development, tutorial" class="w-full rounded-md border border-secondary/25 bg-backone px-3 py-2.5 text-sm text-secondary placeholder:text-secondary/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 md:text-base"/>
        <p class="text-xs text-secondary/60">Separate multiple tags with commas.</p>
      </div>
    </section>

    <!-- Sidebar: category, image -->
    <section class="space-y-4 rounded-md border border-secondary/15 bg-white p-6 text-secondary shadow-sm lg:space-y-5">
      <div class="space-y-1.5">
        <label for="post-category" class="block text-xs font-medium text-secondary/70 md:text-sm">
          Please Select a post category
        </label>
        <p *ngIf="errorCategory" class="text-justify text-xs font-medium text-red-500 md:text-sm">{{errorCategory.message | json }}</p>
        <select id="post-category" name="categoryId" [(ngModel)]="formCategoryId" multiple class="w-full rounded-md border border-secondary/25 bg-backone px-3 py-2.5 text-sm text-secondary focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 md:text-base">
          <option *ngFor="let opt of categoryOptions" [ngValue]="opt.id">{{ opt.name }}</option>
        </select>
      </div>

      <div class="space-y-2">
        <span class="block text-xs font-medium text-secondary/70 md:text-sm">Post Image</span>
        <div class="overflow-hidden rounded-md border border-secondary/20 bg-secondary/5 aspect-video w-full max-h-48">
          <img  [src]="formImagePreview? formImagePreview : imagePlaceHolder" alt="Post image preview" class="h-full w-full object-cover"/>
        </div>
        <div class="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center sm:gap-x-3 sm:gap-y-1">
          <label class="inline-flex cursor-pointer items-center justify-center rounded-md border border-primary/40 bg-primary px-3 py-2 text-center text-xs font-semibold text-backone transition-colors hover:bg-primary/90 focus-within:outline-none focus-within:ring-2 focus-within:ring-primary/30 md:text-sm">
            <span>Choose File</span>
            <input type="file" accept="image/*" class="sr-only" (change)="onImageFileChange($event)"/>
          </label>
          <span class="text-xs text-secondary/70">
            {{ imageUploading ? 'Uploading…' : selectedImageLabel }}
          </span>
          <p *ngIf="imageUploadError" class="w-full text-xs text-red-500">{{ imageUploadError }}</p>
        </div>
      </div>
    </section>
  </div>

  <!-- Full-width content -->
  <section class="space-y-4 rounded-md border border-secondary/15 bg-white p-6 text-secondary shadow-sm">
    <div class="space-y-1.5">
      <label for="post-content" class="block text-xs font-medium text-secondary/70 md:text-sm">Content</label>
<!--  <textarea       id="post-content" name="content" [(ngModel)]="content" rows="14" placeholder="Write the full post body here…" class="min-h-[18rem] w-full resize-y rounded-md border border-secondary/25 bg-backone px-3 py-2.5 text-sm leading-relaxed text-secondary placeholder:text-secondary/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 md:min-h-[22rem] md:text-base"></textarea>-->
      <angular-editor id="post-content" name="content" [(ngModel)]="formContent" placeholder="Write the full post body here…" [config]="editorConfig"></angular-editor>
      <p *ngIf="contentUploadError" class="text-xs text-red-500">{{ contentUploadError }}</p>
    </div>
    <div>
      {{ formContent }}
    </div>
  </section>

  <div class="flex flex-col items-center gap-3">
    <p *ngIf="saveError" class="w-full text-center text-xs text-red-500 md:text-sm">{{ saveError }}</p>
    <button
      type="button"
      (click)="onSave()"
      [disabled]="saving || postLoading || !!postLoadError"
      class="button inline-flex items-center justify-center rounded border border-primary/35 bg-primary px-5 py-2.5 text-center text-xs font-semibold uppercase tracking-wide text-backone hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/25 disabled:opacity-60 md:px-6 md:py-3 md:text-sm">
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </div>
</div>
