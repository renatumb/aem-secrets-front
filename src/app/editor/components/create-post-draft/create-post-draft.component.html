<div class="flex flex-col items-center justify-center gap-3 py-10 text-center text-secondary">
  <p *ngIf="loading" class="text-sm font-medium md:text-base">Creating draft post…</p>

  <div *ngIf="error" class="flex flex-col items-center gap-3">
    <p class="text-sm font-medium text-red-500 md:text-base">{{ error }}</p>
    <button
      type="button"
      (click)="backToPosts()"
      class="button inline-flex items-center justify-center rounded border border-primary/35 bg-primary px-5 py-2.5 text-xs font-semibold text-backone hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/25 md:px-6 md:py-3 md:text-sm">
      Back to posts
    </button>
  </div>
</div>
