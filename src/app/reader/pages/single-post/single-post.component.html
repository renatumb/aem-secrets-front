<app-header-component [showCategoryNavBar]="true"></app-header-component>
<main class="bg-backone">
  <p *ngIf="loading" class="container px-4 py-8 text-center text-sm text-secondary/70 md:px-6">
    Loading post…
  </p>
  <p *ngIf="error && !loading" class="container px-4 py-8 text-center text-sm text-red-600 md:px-6" role="alert">
    {{ error }}
  </p>

  <ng-container *ngIf="post && !loading">
    <section class="container px-4 pt-6 md:px-6 md:pt-10">
      <figure class="overflow-hidden bg-primary rounded">
        <img [src]="heroImageUrl" [alt]="post.title" class="h-52 w-full object-cover sm:h-72 md:h-80 lg:h-96" loading="lazy" decoding="async"/>
      </figure>
    </section>

    <section class="container px-4 pb-8 pt-3 md:px-6 md:pb-12 md:pt-4">
      <ul *ngIf="post.tags?.length" class="mb-2 flex flex-wrap gap-1.5 md:mb-3 md:gap-2">
        <li *ngFor="let tag of post.tags">
          <a [routerLink]="['/tag', tag]" class="inline-block rounded bg-primary px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-backone transition-all hover:scale-115 hover:bg-primary/90 md:px-2.5 md:text-xs">{{ tag }}</a>
        </li>
      </ul>

      <div class="grid grid-cols-1 gap-4 xl:grid-cols-4 xl:items-start xl:gap-3">
        <div class="flex min-w-0 flex-col gap-4 xl:col-span-3">
          <article class="rounded-lg border border-secondary/10 bg-primary/10 p-5 text-secondary/90 shadow-sm md:p-8">
            <h1 class="mb-6 text-center text-xl font-bold uppercase tracking-wide sm:text-2xl md:mb-8 md:text-3xl lg:text-4xl">
              {{ post.title }}
            </h1>
            <h2>{{ post.description}}</h2>
            <div class="text-justify text-sm font-semibold leading-relaxed sm:text-base md:text-lg lg:text-xl" [innerHTML]="post.content_en"></div>
          </article>

          <div class="rounded-lg border border-secondary/10 bg-primary/10 p-4 text-xs text-secondary/85 shadow-sm sm:text-sm md:p-8">
            <app-comment-form></app-comment-form>
          </div>

          <div class="rounded-lg border border-secondary/10 bg-primary/10 p-4 text-secondary/90 shadow-sm md:p-8">
            <app-comment-list></app-comment-list>
          </div>
        </div>

        <aside class="flex w-full flex-col rounded-md bg-backone xl:col-span-1">
          <div class="bg-primary/20 px-1 rounded-md relative">
            <div class="mb-3 lg:mb-5">
              <h2 class="absolute py-2 top-0 mx-auto w-[90%] mb-1.5 text-center text-xs font-bold uppercase tracking-wide text-secondary sm:text-sm md:text-base lg:text-lg">
                Related posts
              </h2>
            </div>
            <!-- Related posts wiring deferred to avoid extra API calls -->
          </div>
        </aside>
      </div>
    </section>
  </ng-container>

  <app-subscription-form></app-subscription-form>
</main>

<app-footer-component></app-footer-component>
