<app-header-component [showCategoryNavBar]="true"></app-header-component>
<main class="bg-backone">
  <section class="container px-4 py-8 md:px-6 md:py-12">
    <div class="mx-auto max-w-3xl overflow-hidden rounded border border-secondary/20 bg-secondary/95 shadow-md ring-1 ring-secondary/10">
      <header class="px-6 py-8 text-center text-backone md:px-10 md:py-10">
        <h1 class="text-xl font-bold uppercase tracking-wide md:text-3xl lg:text-4xl">
          Contact us
        </h1>
        <p class="mx-auto mt-3 max-w-2xl text-xs font-medium leading-relaxed text-backone/90 md:mt-4 md:text-sm lg:text-base">
          Have a question, collaboration idea, or feedback? Send a message and we will get back to you as soon as we can.
        </p>
      </header>

      <div class="border-t border-secondary/20 bg-backone px-6 py-8 md:px-10 md:py-10">
        <form class="flex flex-col gap-5 md:gap-6" (ngSubmit)="onSubmit($event)">
          <div class="flex flex-col gap-1.5">
            <label for="contact-name" class="text-left text-xs font-semibold text-secondary md:text-sm">Name</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" class="w-full rounded border border-secondary/25 bg-secondary/10 px-3 py-2.5 text-xs font-medium text-secondary placeholder:text-secondary/40 focus:border-primary/40 focus:outline-none focus:ring-2 focus:ring-primary/15 md:px-4 md:py-3 md:text-sm" placeholder="Your name"/>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="contact-email" class="text-left text-xs font-semibold text-secondary md:text-sm">Email</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" class="w-full rounded border border-secondary/25 bg-secondary/10 px-3 py-2.5 text-xs font-medium text-secondary placeholder:text-secondary/40 focus:border-primary/40 focus:outline-none focus:ring-2 focus:ring-primary/15 md:px-4 md:py-3 md:text-sm" placeholder="you@example.com"/>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="contact-message" class="text-left text-xs font-semibold text-secondary md:text-sm">Message</label>
            <textarea id="contact-message" name="message" rows="5" class="min-h-[8rem] w-full resize-y rounded border border-secondary/25 bg-secondary/10 px-3 py-2.5 text-xs font-medium text-secondary placeholder:text-secondary/40 focus:border-primary/40 focus:outline-none focus:ring-2 focus:ring-primary/15 md:min-h-[10rem] md:px-4 md:py-3 md:text-sm" placeholder="Write your message here"></textarea>
          </div>

          <div class="mt-2 flex flex-wrap items-center gap-3 md:gap-4">
            <button type="submit" class=" rounded-xl border border-primary/30 bg-primary px-5 py-2.5 text-xs font-semibold text-backone  hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/30  md:px-6 md:py-3 md:text-sm">
              Send message
            </button>
            <a routerLink="/" class="button inline-flex items-center justify-center rounded-xl border-2 border-secondary bg-transparent px-5 py-2.5 text-center text-xs font-semibold text-secondary  hover:bg-secondary/10 focus:outline-none focus:ring-2 focus:ring-secondary/25 md:px-6 md:py-3 md:text-sm">
              Back to home
            </a>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>
<app-footer-component></app-footer-component>
