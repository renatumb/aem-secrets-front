<section class="container">
  <div class="w-[80%] lg:w-fit mx-auto p-5 lg:px-30 flex flex-col flex-nowrap gap-4 text-center text-secondary border border-secondary rounded-md">
    <h3 class="text-2xl lg:text-3xl tracking-wide uppercase font-bold">Subscription Form</h3>
    <p class="text-base lg:text-lg tracking-wide font-medium">Subscribe for quick AEM tips and insights!</p>
    <!--    -->
    <form class="grid grid-cols-1 gap-2 md:flex md:flex-col md:items-center" (ngSubmit)="submit()" #subForm="ngForm">
      <div class="font-semibold text-secondary md:text-lg">
        <input type="email" name="email" placeholder="email" required email [(ngModel)]="email" [disabled]="submitting" class="border border-secondary rounded m-2 md:mx-auto p-1"/>
        <input type="text" name="name" placeholder="Name" required [(ngModel)]="name" [disabled]="submitting" class="border border-secondary rounded m-2 p-1"/>
      </div>
      <label class="mx-auto max-w-md text-left text-xs font-medium leading-relaxed md:text-sm">
        <input type="checkbox" name="consent" required [(ngModel)]="consented" [disabled]="submitting" class="mr-2 align-middle"/>
        I agree to receive occasional emails from AEM Secrets and have read the
        <a routerLink="/privacy-policy" class="text-primary underline hover:text-secondary">Privacy Policy</a>.
        You can unsubscribe anytime via the link in our emails.
      </label>
      <button type="submit" [disabled]="submitting || subForm.invalid" class="w-fit justify-self-center bg-secondary text-backone button text-base tracking-wider py-2 px-3 font-semibold md:max-h-fit disabled:opacity-60">
        {{ submitting ? 'Sending...' : 'Subscribe' }}
      </button>
      <p class="mx-auto max-w-md text-left text-xs font-medium leading-relaxed text-secondary/80 md:text-sm">
        This site is protected by reCAPTCHA and the Google
        <a href="https://policies.google.com/privacy" rel="noopener noreferrer" target="_blank" class="text-primary underline hover:text-secondary">Privacy Policy</a>
        and
        <a href="https://policies.google.com/terms" rel="noopener noreferrer" target="_blank" class="text-primary underline hover:text-secondary">Terms of Service</a>
        apply.
      </p>
    </form>
    <p *ngIf="successMessage" class="text-sm font-medium text-emerald-700" role="status">{{ successMessage }}</p>
    <p *ngIf="error" class="text-sm font-medium text-red-600" role="alert">{{ error }}</p>
  </div>
</section>
