<h2 class="mb-1.5 text-left text-xs font-bold uppercase tracking-wide text-secondary sm:mb-2 sm:text-sm md:text-base">
  Leave a comment
</h2>
<p class="mb-4 max-w-2xl text-left text-xs leading-relaxed text-secondary/75 sm:mb-5 sm:text-sm md:mb-5">
  Join the conversation — your thoughts matter.
</p>

<form #commentForm="ngForm" class="flex w-full max-w-3xl flex-col items-start gap-4 rounded-lg border-2 border-secondary/35 bg-backone p-4 text-secondary shadow-md ring-1 ring-secondary/10 sm:gap-5 sm:p-5 md:gap-5 md:p-6" (ngSubmit)="onSubmit()" >
  <div class="grid w-full grid-cols-1 gap-4 sm:grid-cols-2">
    <div class="flex w-full flex-col gap-1.5">
      <label for="comment-name" class="text-left text-xs font-semibold text-secondary sm:text-sm">Name</label>
      <input id="comment-name" name="nameAuthor" type="text" autocomplete="name" required [(ngModel)]="nameAuthor" [disabled]="submitting" class="w-full rounded-lg border border-secondary/25 bg-secondary/10 px-3 py-2 text-xs font-medium text-secondary placeholder:text-secondary/40 focus:border-primary/35 focus:outline-none focus:ring-2 focus:ring-primary/15 sm:text-sm md:py-2.5" placeholder="" />
    </div>

    <div class="flex w-full flex-col gap-1.5">
      <label for="comment-email" class="text-left text-xs font-semibold text-secondary sm:text-sm">Email</label>
      <input id="comment-email" name="emailAuthor" type="email" autocomplete="email" required email [(ngModel)]="emailAuthor" [disabled]="submitting" class="w-full rounded-lg border border-secondary/25 bg-secondary/10 px-3 py-2 text-xs font-medium text-secondary placeholder:text-secondary/40 focus:border-primary/35 focus:outline-none focus:ring-2 focus:ring-primary/15 sm:text-sm md:py-2.5" placeholder="" />
    </div>
  </div>

  <div class="flex w-full flex-col gap-1.5">
    <label for="comment-body" class="text-left text-xs font-semibold text-secondary sm:text-sm">Comment</label>
    <textarea id="comment-body" name="content" rows="4" required [(ngModel)]="content" [disabled]="submitting" class="min-h-[4.5rem] w-full resize-y rounded-lg border border-secondary/25 bg-secondary/10 px-3 py-2 text-xs font-medium text-secondary placeholder:text-secondary/40 focus:border-primary/35 focus:outline-none focus:ring-2 focus:ring-primary/15 sm:min-h-[5rem] sm:text-sm md:py-2.5" placeholder="..."></textarea>
  </div>

  <button type="submit" [disabled]="submitting || commentForm.invalid" class="!rounded-lg w-full max-w-[10rem] self-start border border-secondary/25 bg-secondary/18 px-4 py-2 text-center text-xs font-semibold text-secondary transition-colors hover:!scale-100 hover:!translate-y-0 hover:bg-secondary/28 focus:outline-none focus:ring-2 focus:ring-primary/20 disabled:opacity-60 sm:max-w-[11rem] sm:py-2.5 sm:text-sm md:px-5">
    {{ submitting ? 'Sending…' : 'Add comment' }}
  </button>

  <p *ngIf="successMessage" class="text-xs font-medium text-emerald-700 sm:text-sm" role="status">{{ successMessage }}</p>
  <p *ngIf="error" class="text-xs font-medium text-red-600 sm:text-sm" role="alert">{{ error }}</p>

  <p class="text-xs font-medium leading-relaxed text-secondary/75 sm:text-sm">
    This site is protected by reCAPTCHA and the Google
    <a href="https://policies.google.com/privacy" rel="noopener noreferrer" target="_blank" class="text-primary underline hover:text-secondary">Privacy Policy</a>
    and
    <a href="https://policies.google.com/terms" rel="noopener noreferrer" target="_blank" class="text-primary underline hover:text-secondary">Terms of Service</a>
    apply.
  </p>
</form>
