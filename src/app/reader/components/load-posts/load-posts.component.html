<div class="flex flex-col justify-center items-center gap-4 px-10 py-10 xl:gap-5 xl:pt-14">
  <p *ngIf="loading && !posts.length" class="text-sm font-medium text-secondary/70">
    Loading posts…
  </p>

  <div *ngIf="posts.length" class="grid w-full grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
    <app-post-card *ngFor="let post of posts" [post]="post"></app-post-card>
  </div>

  <p *ngIf="!loading && !posts.length" class="text-sm font-medium text-secondary/70">
    No posts found.
  </p>

  <button *ngIf="hasMore" type="button" (click)="loadMore.emit()" [disabled]="loading" class="bg-secondary text-backone font-medium my-3 py-3 px-5 hover:shadow-lg hover:shadow-primary/50 hover:text-shadow-xs hover:text-shadow-primary disabled:opacity-60">
    {{ loading ? 'Loading…' : 'Load more' }}
  </button>
</div>
